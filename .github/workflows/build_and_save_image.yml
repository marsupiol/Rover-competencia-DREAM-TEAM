name: Build and save Docker image artifact

on:
  workflow_dispatch: {}

jobs:
  build-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build image
        run: |
          docker build -t mini_plus_ros2:ci -f Dockerfile .

      - name: Save image as tar.gz
        run: |
          docker save mini_plus_ros2:ci | gzip > mini_plus_ros2_ci.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mini_plus_ros2_ci
          path: mini_plus_ros2_ci.tar.gz
