services:
  rover:
    build:
      context: .
      dockerfile: Dockerfile
    image: dream-team/mini-plus-rover:jazzy
    container_name: mini_plus_rover
    environment:
      # full | ekf | bridge | manual (ver comentarios en entrypoint.sh)
      ROVER_MODE: "full"
      CHROME_EXECUTABLE_PATH: "/usr/bin/google-chrome-stable"
    ports:
      - "8000:8000"
    volumes:
      # Montá tu .env real con credenciales (no se versiona ni se copia a la imagen).
      - ./src/sdk_server/.env:/root/ros2_ws/src/sdk_server/.env:ro
      - ./src:/root/ros2_ws/src
      - ./entrypoint.sh:/root/ros2_ws/entrypoint.sh
    restart: unless-stopped
