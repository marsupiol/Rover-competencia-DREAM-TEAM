ekf_filter_node_odom:
  ros__parameters:
    frequency: 30.0
    
    # 1. MITIGACIÓN DE LATENCIA (4G/LTE Jitter)
    sensor_timeout: 0.5           # Si no hay datos en 0.5s, pasa a modo Dead-Reckoning
    delay: 0.1                    # Buffer de 100ms para ordenar paquetes desordenados
    transform_time_offset: 0.05   # Publicar TF 50ms en el futuro para evitar errores de extrapolación en Nav2
    
    two_d_mode: true              # Bloquea Z, roll y pitch (crucial para rovers terrestres)
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # 2. CONFIGURACIÓN DE ODOMETRÍA (Ruedas)
    odom0: /wheel_odom
    # Variables: [X, Y, Z, roll, pitch, yaw, Vx, Vy, Vz, Vroll, Vpitch, Vyaw, Ax, Ay, Az]
    # Leemos SOLO velocidad lineal (Vx, Vy). Dejamos que el IMU dicte la rotación.
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false

    # 3. CONFIGURACIÓN DE IMU (MPU-6050 + Brújula)
    imu0: /imu/data
    # Leemos SOLO el Yaw absoluto de la brújula (índice 5).
    # Desactivamos Vyaw (índice 11) porque la red 4G destruye la precisión de la derivada.
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, false,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false # Debe ser false para anclar el Norte Real de la brújula

ekf_filter_node_map:
  ros__parameters:
    frequency: 30.0
    
    # Mismas defensas anti-latencia para el nodo global
    sensor_timeout: 0.5
    delay: 0.1
    transform_time_offset: 0.05
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    odom0: /wheel_odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false

    # 4. CONFIGURACIÓN DEL GNSS (GPS)
    odom1: /odometry/gps  # Tópico generado por navsat_transform_node
    # El GPS solo nos da posición absoluta X e Y.
    odom1_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_differential: false

    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, false,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false

navsat_transform:
  ros__parameters:
    frequency: 30.0
    delay: 0.0 # navsat no necesita delay si los EKF ya ordenaron la telemetría
    magnetic_declination_radians: 0.0 # Se asume calibrado in-situ o en bridge
    yaw_offset: 0.0
    zero_altitude: true
    broadcast_utm_transform: false
    publish_filtered_gps: true
    use_odometry_yaw: false
    wait_for_datum: false