ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true

    # Definición de los marcos de referencia (Frames)
    map_frame: map              # El mapa global
    odom_frame: odom            # Donde arranca el robot (origen local)
    base_link_frame: base_link  # El centro físico del Mini+
    world_frame: odom           # Qué frame usamos como referencia absoluta

    # Sensor 1: Odometría de las ruedas del Mini+
    # Formato de la matriz: [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    odom0: /wheel_odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false

    # Sensor 2: IMU
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: true
