gps_waypoint_controller:
  ros__parameters:
    goal_tolerance_m: 6.0
    goal_dwell_s: 1.0
    align_threshold_deg: 18.0
    coarse_align_threshold_deg: 45.0
    approach_align_distance_m: 8.0
    forward_speed: 0.35
    turn_speed: 0.55
    drive_correction_gain: 0.0
    max_drive_angular: 0.14
    invert_angular: true
    control_loop_hz: 3.0
    turn_burst_s: 1.4
    pause_after_turn_s: 1.3
    max_heading_jump_deg: 40.0
    heading_filter_alpha: 0.35
    reached_publish_period_s: 1.0
