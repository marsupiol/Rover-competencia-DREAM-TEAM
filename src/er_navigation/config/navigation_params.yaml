    heading_filter_alpha: 0.18
    angular_filter_alpha: 0.5
    heading_offset_deg: 0.0
    invert_angular: false
    stuck_timeout_s: 8.0
    progress_epsilon_m: 0.8
    recovery_backup_s: 1.8
    recovery_turn_s: 2.5
    recovery_reverse_speed: -0.25
    recovery_turn_speed: 0.45
