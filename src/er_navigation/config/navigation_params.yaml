gps_waypoint_controller:
  ros__parameters:
    # NOTA: estos valores son los que el código termina forzando via los
    # clamps de seguridad en __init__ (a propósito, ver comentarios ahí).
    # Se dejaron acá iguales al resultado real del clamp para que el yaml
    # no mienta sobre el comportamiento efectivo del rover.
    goal_tolerance_m: 6.0            # antes 6.0 -> clamp min(3.0, raw) lo forzaba a 3.0
    goal_dwell_s: 1.0
    align_threshold_deg: 18.0
    coarse_align_threshold_deg: 45.0
    approach_align_distance_m: 8.0
    forward_speed: 0.55
    turn_speed: 0.55
    drive_correction_gain: 0.03      # antes 0.0 -> clamp max(0.03, raw) lo forzaba a 0.03
    max_drive_angular: 0.4           # antes 0.14 -> clamp max(0.4, raw) lo forzaba a 0.4
    invert_angular: true
    control_loop_hz: 3.0
    turn_burst_s: 0.25               # antes 1.4 -> clamp min(0.25, raw) lo forzaba a 0.25
    pause_after_turn_s: 2.2          # antes 1.3 -> clamp max(2.2, raw) lo forzaba a 2.2
    max_heading_jump_deg: 150.0      # antes 40.0 -> clamp max(150.0, raw) lo forzaba a 150.0
    heading_filter_alpha: 0.35
    reached_publish_period_s: 1.0