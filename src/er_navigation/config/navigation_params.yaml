gps_waypoint_controller:
  ros__parameters:
    goal_tolerance_m: 3.0
    goal_dwell_s: 1.5
    max_linear_speed: 0.55
    min_linear_speed: 0.22
    max_angular_speed: 0.45
    max_drive_angular_speed: 0.22
    kp_angular: 0.006
    kd_angular: 0.04
    kp_linear: 0.05
    turn_in_place_threshold_deg: 28.0
    drive_heading_deadband_deg: 6.0
